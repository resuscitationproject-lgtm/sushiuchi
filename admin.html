<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面｜寿司打ちタイピング大会</title>
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

<header class="app-header">
  <img class="logo" src="assets/itclub-logo.jpg" alt="北九州ITクラブ">
  <h1>管理画面<span class="accent-dot"></span></h1>
</header>

<div class="admin-wrap">

  <div id="login-box" class="login-box">
    <h2>管理者ログイン</h2>
    <div class="field">
      <input type="password" id="admin-password" placeholder="パスワード">
    </div>
    <button class="primary" id="login-btn" style="margin-top:10px;">ログイン</button>
    <p id="login-error" style="color:#e0483e; font-size:13px;"></p>
  </div>

  <div id="admin-body" class="hidden">

    <div class="admin-card">
      <h2>成績データ</h2>
      <div class="toolbar" style="margin-bottom:12px;">
        <span class="stat-pill" id="stat-count">参加人数: 0人</span>
        <span class="stat-pill" id="stat-top">最高記録: 0円</span>
        <button class="secondary" id="refresh-btn">更新</button>
        <button class="primary" id="export-csv-btn">CSVエクスポート</button>
        <button class="secondary" id="clear-results-btn" style="border-color:#e0483e; color:#e0483e;">全件削除</button>
      </div>
      <div class="table-wrap">
        <table class="results-table">
          <thead>
            <tr>
              <th>日時</th><th>名前</th><th>年齢層</th><th>実年齢</th><th>スコア</th><th>正解数</th><th>ミス数</th>
            </tr>
          </thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="admin-card">
      <h2>広告画像（左：6枠）</h2>
      <p style="font-size:13px; color:#7690a5;">Instagram投稿用の正方形画像がおすすめです。自動的にリサイズして保存します。</p>
      <div class="upload-grid" id="upload-grid-left"></div>
    </div>

    <div class="admin-card">
      <h2>広告画像（右：6枠）</h2>
      <div class="upload-grid" id="upload-grid-right"></div>
    </div>

    <div class="admin-card">
      <h2>問題の読み上げ</h2>
      <p style="font-size:13px; color:#7690a5;">
        出題された寿司ネタを、パソコンに入っている日本語音声で読み上げます（音声ファイル不要）。<br>
        声の種類はパソコンによって変わります。高さ・速さを上げるとアニメ風の元気な声に近づきます。<br>
        ※設定はこのパソコンのブラウザに保存されます。当日使うパソコンで設定してください。
      </p>
      <div class="field" style="max-width:320px;">
        <label><input type="checkbox" id="tts-enabled"> 読み上げを有効にする</label>
      </div>
      <div class="field" style="max-width:420px; margin-top:10px;">
        <label for="tts-voice">声</label>
        <select id="tts-voice"></select>
      </div>
      <div class="tts-sliders">
        <div class="field"><label for="tts-pitch">高さ：<span id="tts-pitch-label"></span></label><input type="range" id="tts-pitch" min="0.5" max="2" step="0.1"></div>
        <div class="field"><label for="tts-rate">速さ：<span id="tts-rate-label"></span></label><input type="range" id="tts-rate" min="0.6" max="2" step="0.1"></div>
        <div class="field"><label for="tts-volume">音量：<span id="tts-volume-label"></span></label><input type="range" id="tts-volume" min="0" max="1" step="0.1"></div>
      </div>
      <div class="toolbar" style="margin-top:12px;">
        <button class="secondary" id="tts-test-btn">テスト再生（ちゅうとろ）</button>
        <button class="secondary" id="tts-test-rare-btn">テスト再生（レア問題）</button>
      </div>
    </div>

    <div class="admin-card">
      <h2>ゲーム設定</h2>
      <div class="field" style="max-width:240px;">
        <label for="duration-input">デフォルト制限時間（秒）</label>
        <input type="number" id="duration-input" min="10" max="600">
      </div>
      <button class="secondary" id="save-duration-btn" style="margin-top:8px;">保存</button>

      <hr style="margin:20px 0; border:none; border-top:1px solid #e3edf6;">

      <div class="field" style="max-width:240px;">
        <label for="new-password">管理者パスワードの変更</label>
        <input type="password" id="new-password" placeholder="新しいパスワード">
      </div>
      <button class="secondary" id="change-password-btn" style="margin-top:8px;">パスワードを変更</button>
    </div>

  </div>

</div>

<footer class="app-footer"><a href="index.html">← ゲーム画面に戻る</a></footer>

<script src="js/storage.js?v=8"></script>
<script src="js/words.js?v=8"></script>
<script src="js/speech.js?v=8"></script>
<script src="js/admin.js?v=8"></script>
</body>
</html>
