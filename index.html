<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寿司打ちタイピング大会｜北九州ITクラブ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <img class="logo" src="assets/itclub-logo.jpg" alt="北九州ITクラブ">
  <h1>寿司打ちタイピング大会<span class="accent-dot"></span></h1>
</header>

<main class="layout">
  <div class="ad-column" id="ads-left"></div>

  <div class="game-panel">

    <!-- 受付画面 -->
    <section id="screen-entry" class="screen">
      <h2>参加者登録</h2>
      <div class="field">
        <label for="player-name">お名前（ニックネーム可）</label>
        <input type="text" id="player-name" maxlength="20" placeholder="例）すし太郎">
      </div>
      <div class="field">
        <label>年齢層</label>
        <div class="age-grid" id="age-grid"></div>
      </div>
      <div class="field hidden" id="age-value-field">
        <label for="age-value">実年齢</label>
        <input type="number" id="age-value" min="1" max="120" placeholder="例）35">
      </div>
      <div class="field">
        <label>制限時間</label>
        <div class="duration-row">
          <button type="button" data-sec="60">60秒</button>
          <button type="button" data-sec="90">90秒</button>
          <button type="button" data-sec="120">120秒</button>
        </div>
      </div>
      <button class="primary" id="start-btn" disabled>スタート！</button>
    </section>

    <!-- プレイ画面 -->
    <section id="screen-play" class="screen hidden">
      <div class="hud">
        <div>残り時間: <span class="timer" id="hud-timer">60</span> 秒</div>
        <div class="yen"><span>合計</span> ¥<span id="hud-yen">0</span></div>
      </div>
      <div class="word-card">
        <div class="kana" id="word-kana">まぐろ</div>
        <div class="price-tag" id="word-price">150円</div>
      </div>
      <div class="typing-box" id="typing-box"></div>
      <div class="combo-toast" id="combo-toast"></div>
      <p style="color:#7690a5; font-size:13px;">ローマ字で打ってね（例：まぐろ → maguro）</p>
    </section>

    <!-- 結果画面 -->
    <section id="screen-result" class="screen hidden">
      <h2>結果発表！</h2>
      <div style="text-align:center;">
        <div class="result-total" id="result-total">0<span>円</span></div>
        <div style="margin-top:8px;"><span class="result-rank" id="result-rank">見習い</span></div>
      </div>
      <div class="result-stats">
        <div>正解数<b id="result-correct">0</b></div>
        <div>ミス数<b id="result-mistake">0</b></div>
      </div>
      <button class="primary" id="play-again-btn">もう一度あそぶ</button>
    </section>

  </div>

  <div class="ad-column" id="ads-right"></div>
</main>

<footer class="app-footer">北九州ITクラブ｜まんまる文化祭 2026.11.21-22</footer>
<a class="admin-link" href="admin.html">admin</a>

<script src="js/storage.js"></script>
<script src="js/words.js"></script>
<script src="js/game.js"></script>
</body>
</html>
